<!-- PARE DE OLHAR O CÓDIGO, NÃO TE DEI NENHUM GRIMÓRIO-->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Toca-Discos do Elite Way</title>
<style>
:root {
  color-scheme: dark;
  --bg: #0a0508;
  --fg: #f4e9ee;
  --muted: #a7939c;
  --accent: #e0102f;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: Georgia, 'Times New Roman', serif;
  overflow: hidden;
  transition: background 1s;
  user-select: none;
  touch-action: none;
}
canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
#app {
  position: relative;
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: space-between;
  padding: 12px 10px;
}
h1 {
  margin: 0;
  font-size: clamp(16px, 3.5vw, 26px);
  letter-spacing: .25em;
  text-transform: uppercase;
  text-align: center;
  text-shadow: 0 0 14px var(--accent);
}
#now {
  font-size: 14px;
  color: var(--muted);
  min-height: 20px;
  text-align: center;
}

/* Toca-discos melhorado */
#deck {
  position: relative;
  width: min(92vw, 420px);
  aspect-ratio: 1.15;
  background: linear-gradient(135deg, #2c2d30, #131416);
  border: 1px solid #444;
  border-radius: 12px;
  box-shadow: 
    inset 0 1px 2px rgba(255,255,255,0.1),
    0 20px 40px rgba(0,0,0,0.8),
    0 0 40px color-mix(in srgb, var(--accent) 40%, transparent);
  transition: box-shadow 1s;
}

/* Prato giratório com borda Strobe */
#platter-base {
  position: absolute;
  left: 6%;
  top: 9%;
  width: 62%;
  aspect-ratio: 1;
  border-radius: 50%;
  background: repeating-conic-gradient(#888 0 1.5deg, #111 1.5deg 3deg);
  box-shadow: 0 10px 20px rgba(0,0,0,0.8);
  display: flex;
  align-items: center;
  justify-content: center;
}
#platter {
  width: 96%;
  aspect-ratio: 1;
  border-radius: 50%;
  background: radial-gradient(circle at 30% 30%, #333, #050505);
  box-shadow: inset 0 0 10px #000;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}
#platter.drop { outline: 3px dashed var(--accent); outline-offset: 6px; }
#disc {
  position: absolute;
  width: 94%;
  aspect-ratio: 1;
  border-radius: 50%;
  background: repeating-radial-gradient(#111 0 2px, #1a1a1a 3px 4px);
  display: none;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 10px rgba(0,0,0,0.8);
}
#disc::before {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: conic-gradient(transparent 0deg, rgba(255,255,255,0.1) 45deg, transparent 90deg, transparent 180deg, rgba(255,255,255,0.1) 225deg, transparent 270deg);
  pointer-events: none;
}
#disc.on { display: flex; }
#disc.spin { animation: spin 2.2s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Selo do disco */
.label {
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px; /* Aumentado para os emojis da prateleira */
  font-weight: bold;
  text-align: center;
  color: #fff;
  position: relative;
  overflow: hidden;
}
#disc .label { width: 36%; aspect-ratio: 1; box-shadow: 0 0 5px rgba(0,0,0,0.5); font-size: 32px; } /* Tamanho grande ao tocar */
.label::after {
  content: '';
  position: absolute;
  width: 7%;
  aspect-ratio: 1;
  border-radius: 50%;
  background: #111;
  box-shadow: inset 0 1px 2px rgba(0,0,0,0.8);
  left: 46.5%;
  top: 46.5%;
}

/* Braço mecânico aprimorado */
#arm-base {
  position: absolute;
  right: 12%;
  top: 10%;
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: radial-gradient(circle at 30% 30%, #555, #111);
  border: 2px solid #222;
  box-shadow: 0 5px 15px rgba(0,0,0,0.8);
  display: flex;
  align-items: center;
  justify-content: center;
}
#arm {
  position: absolute;
  width: 6px;
  height: 180px;
  background: linear-gradient(to right, #ccc, #777, #ccc);
  border-radius: 4px;
  transform-origin: 50% 12px;
  transform: rotate(-22deg);
  transition: transform 1s ease-in-out;
  box-shadow: 5px 0 10px rgba(0,0,0,0.6);
  z-index: 5;
}
#arm.down { transform: rotate(35deg); }
#arm::after {
  content: '';
  position: absolute;
  bottom: -15px;
  left: -8px;
  width: 22px;
  height: 35px;
  background: linear-gradient(135deg, #333, #111);
  border-top: 5px solid #888;
  border-radius: 3px;
  box-shadow: 2px 5px 8px rgba(0,0,0,0.8);
  transform: rotate(22deg);
}

/* Botão Ejetar */
#stop {
  position: absolute;
  right: 6%;
  bottom: 6%;
  background: rgba(0,0,0,0.6);
  color: var(--fg);
  border: 1px solid var(--accent);
  border-radius: 20px;
  padding: 6px 12px;
  font: inherit;
  font-size: 12px;
  cursor: pointer;
  backdrop-filter: blur(4px);
  transition: background 0.3s;
}
#stop:hover { background: var(--accent); }

/* Adesivos SVGs */
.stk {
  position: absolute;
  cursor: pointer;
  transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
.stk svg {
  width: 38px;
  height: 38px;
  filter: drop-shadow(0 3px 4px rgba(0,0,0,0.6));
  transform: rotate(-10deg);
}
.stk:hover { transform: scale(1.15) rotate(5deg); }

/* Prateleira e Vinis */
#shelf {
  display: flex;
  gap: clamp(4px, 1.6vw, 14px);
  justify-content: center;
  align-items: flex-end;
  padding: 8px;
  width: 100%;
}
.v {
  width: clamp(48px, 13.5vw, 86px);
  aspect-ratio: 1;
  border-radius: 50%;
  background: repeating-radial-gradient(#0c0c0c 0 2px, #1b1b1b 3px 4px);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: grab;
  position: relative;
  box-shadow: 0 4px 10px #000;
  touch-action: none;
  flex: 0 0 auto;
}
.v::before {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: conic-gradient(transparent 0deg, rgba(255,255,255,0.1) 45deg, transparent 90deg, transparent 180deg, rgba(255,255,255,0.1) 225deg, transparent 270deg);
  pointer-events: none;
}
.v .label { width: 40%; aspect-ratio: 1; font-size: 8px; }
.v span.n { position: absolute; bottom: -17px; font-size: 11px; color: var(--muted); white-space: nowrap; }
.v.drag { position: fixed; z-index: 50; cursor: grabbing; pointer-events: none; transform: scale(1.15); }
.v.used { opacity: 0.25; }

/* Animações e Citações */
.quote {
  position: fixed;
  z-index: 60;
  pointer-events: none;
  font-size: clamp(16px, 4vw, 26px);
  font-style: italic;
  text-shadow: 0 0 12px var(--accent), 0 2px 4px #000;
  animation: fl 3.5s ease-out forwards;
  text-align: center;
  max-width: 80vw;
}
@keyframes fl { 0% { opacity: 0; transform: translateY(20px) scale(.8); } 15% { opacity: 1; } 100% { opacity: 0; transform: translateY(-140px) scale(1.1); } }
#hint { font-size: 12px; color: var(--muted); text-align: center; margin-bottom: 14px; }


/* Atmosfera: o fundo acompanha a personalidade de cada faixa */
body {
  position: relative;
  isolation: isolate;
  background: var(--scene-base, var(--bg));
  transition: background-color 1.1s ease;
}
body::before {
  content: "";
  position: fixed;
  inset: -8%;
  z-index: 0;
  pointer-events: none;
  opacity: .82;
  background:
    radial-gradient(ellipse at 50% 52%, color-mix(in srgb, var(--accent) 17%, transparent), transparent 48%),
    radial-gradient(ellipse at 18% 20%, rgba(255,255,255,.045), transparent 32%),
    radial-gradient(ellipse at 82% 82%, rgba(120,65,95,.10), transparent 35%);
  animation: ambience-drift 18s ease-in-out infinite alternate;
  transition: background 1.2s ease, opacity 1.2s ease;
}
body::after {
  content: "";
  position: fixed;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  background:
    radial-gradient(ellipse at center, transparent 35%, rgba(0,0,0,.20) 100%),
    linear-gradient(180deg, rgba(0,0,0,.10), transparent 26% 72%, rgba(0,0,0,.22));
}
@keyframes ambience-drift {
  from { transform: translate3d(-1%, -.4%, 0) scale(1); }
  to   { transform: translate3d(1%, .6%, 0) scale(1.045); }
}
canvas { z-index: 2; pointer-events: none; }
#app { z-index: 3; }

/* Cada música ganha uma paisagem própria, sem esconder os efeitos do canvas */
body[data-theme="mia"]::before {
  opacity: .94;
  background:
    radial-gradient(ellipse at 17% 27%, rgba(255,126,182,.25), transparent 34%),
    radial-gradient(ellipse at 80% 72%, rgba(167,123,255,.18), transparent 35%),
    radial-gradient(circle, rgba(255,226,240,.25) 0 1px, transparent 1.7px) 0 0 / 68px 68px,
    radial-gradient(circle, rgba(255,190,220,.16) 0 1px, transparent 1.6px) 26px 33px / 102px 102px;
}
body[data-theme="roberta"]::before {
  opacity: .92;
  background:
    radial-gradient(ellipse at 14% 72%, rgba(255,68,23,.30), transparent 34%),
    radial-gradient(ellipse at 85% 24%, rgba(224,16,47,.25), transparent 38%),
    repeating-linear-gradient(128deg, transparent 0 54px, rgba(255,83,38,.045) 55px 57px, transparent 58px 112px);
}
body[data-theme="giovanni"]::before {
  opacity: .88;
  background:
    radial-gradient(ellipse at 50% 18%, rgba(255,190,57,.25), transparent 39%),
    radial-gradient(ellipse at 82% 82%, rgba(255,111,20,.18), transparent 33%),
    repeating-conic-gradient(from 8deg at 50% 45%, transparent 0deg 17deg, rgba(255,210,103,.045) 17.5deg 18.5deg, transparent 19deg 35deg);
}
body[data-theme="diego"]::before {
  opacity: .9;
  background:
    radial-gradient(ellipse at 76% 24%, rgba(48,107,255,.28), transparent 34%),
    radial-gradient(ellipse at 20% 80%, rgba(69,174,255,.16), transparent 38%),
    radial-gradient(circle, rgba(180,210,255,.28) 0 1px, transparent 1.6px) 12px 18px / 76px 76px,
    repeating-linear-gradient(112deg, transparent 0 112px, rgba(83,147,255,.055) 113px 115px, transparent 116px 190px);
}
body[data-theme="miguel"]::before {
  opacity: .9;
  background:
    radial-gradient(ellipse at 50% 52%, rgba(190,0,24,.25), transparent 42%),
    radial-gradient(ellipse at 12% 15%, rgba(255,38,55,.15), transparent 35%),
    repeating-radial-gradient(ellipse at 50% 52%, transparent 0 82px, rgba(255,42,55,.045) 84px 85px, transparent 88px 142px);
}
body[data-theme="lupita"]::before {
  opacity: .92;
  background:
    radial-gradient(ellipse at 18% 72%, rgba(56,224,184,.23), transparent 36%),
    radial-gradient(ellipse at 83% 25%, rgba(167,123,255,.22), transparent 35%),
    radial-gradient(circle, rgba(255,211,107,.19) 0 1.2px, transparent 1.8px) 0 0 / 82px 82px,
    repeating-linear-gradient(35deg, transparent 0 94px, rgba(56,224,184,.035) 95px 97px, transparent 98px 170px);
}

/* O aparelho continua com o mesmo desenho, mas ganha luz, relevo e bordas suaves */
#deck {
  border: 1px solid rgba(255,255,255,.16);
  border-radius: 18px;
  background:
    linear-gradient(145deg, rgba(255,255,255,.075), transparent 28%),
    linear-gradient(150deg, #34343a 0%, #25252b 43%, #141419 100%);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.18),
    inset 0 -7px 15px rgba(0,0,0,.42),
    0 2px 0 rgba(0,0,0,.9),
    0 17px 35px rgba(0,0,0,.72),
    0 0 34px color-mix(in srgb, var(--accent) 24%, transparent);
  transform: perspective(900px) rotateX(1deg);
  isolation: isolate;
}
#deck::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  pointer-events: none;
  background:
    linear-gradient(135deg, rgba(255,255,255,.11), transparent 23% 70%, rgba(0,0,0,.12)),
    linear-gradient(180deg, rgba(255,255,255,.035), transparent 25%);
  z-index: 0;
}
#platter-base {
  border: 1px solid rgba(255,255,255,.13);
  background:
    repeating-conic-gradient(rgba(255,255,255,.12) 0 1deg, rgba(0,0,0,.12) 1deg 2.7deg),
    radial-gradient(circle at 31% 26%, #45464c 0%, #24252b 48%, #101116 78%, #3b3c42 79%, #111216 83%);
  box-shadow: 0 8px 18px rgba(0,0,0,.76), inset 0 1px 2px rgba(255,255,255,.13);
}
#platter {
  background: radial-gradient(circle at 34% 28%, #34353a 0%, #17181d 55%, #08090c 100%);
  box-shadow: inset 0 2px 8px rgba(0,0,0,.9), inset 0 0 0 1px rgba(255,255,255,.08), 0 1px 0 rgba(255,255,255,.08);
}

/* Vinis: sulcos reais, brilho discreto e paleta individual por faixa */
.v, #disc {
  --vinyl-shadow: #09090d;
  --vinyl-mid: #24212a;
  --vinyl-glow: #574052;
  position: relative;
  overflow: hidden;
  border: 1px solid rgba(255,255,255,.11);
  background-color: var(--vinyl-shadow);
  background-image:
    repeating-radial-gradient(circle at 50% 50%, rgba(255,255,255,.105) 0 1px, rgba(0,0,0,.16) 1.5px 3px, transparent 3.5px 4.6px),
    radial-gradient(circle at 34% 27%, var(--vinyl-glow) 0%, var(--vinyl-mid) 43%, var(--vinyl-shadow) 79%);
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,.07),
    inset 0 0 22px rgba(0,0,0,.72),
    0 5px 12px rgba(0,0,0,.58);
}
.v::before, #disc::before {
  background:
    conic-gradient(from 25deg, transparent 0deg 38deg, rgba(255,255,255,.17) 48deg, transparent 66deg 174deg, rgba(255,255,255,.08) 205deg, transparent 225deg 360deg),
    radial-gradient(circle at 30% 24%, rgba(255,255,255,.11), transparent 31%);
  mix-blend-mode: screen;
}
.v::after, #disc::after {
  content: "";
  position: absolute;
  inset: 4.5%;
  border: 1px solid rgba(255,255,255,.12);
  border-radius: 50%;
  box-shadow: inset 0 0 0 1px rgba(0,0,0,.22);
  pointer-events: none;
}
.v { transition: transform .22s ease, opacity .3s ease, filter .22s ease; }
.v:hover { transform: translateY(-4px) scale(1.045); filter: brightness(1.13); }
.v.drag { transition: none; transform: scale(1.15); z-index: 50; }

/* Mia — rosa antigo, brilho suave e atmosfera de sonho */
.v[data-theme="mia"], #disc[data-theme="mia"] {
  --vinyl-shadow: #210d20; --vinyl-mid: #5a2147; --vinyl-glow: #bd5d88;
  background-image:
    repeating-radial-gradient(circle, rgba(255,223,239,.15) 0 1px, rgba(25,5,25,.24) 1.5px 3px, transparent 3.5px 4.6px),
    conic-gradient(from 35deg, transparent 0 52deg, rgba(255,182,215,.16) 53deg 83deg, transparent 84deg 210deg, rgba(199,154,255,.12) 211deg 240deg, transparent 241deg),
    radial-gradient(circle at 33% 27%, #bd6b91 0%, #572346 48%, #1b0a1c 82%);
}
/* Roberta — vermelho queimado, preto e cortes diagonais */
.v[data-theme="roberta"], #disc[data-theme="roberta"] {
  --vinyl-shadow: #100609; --vinyl-mid: #4b1019; --vinyl-glow: #b51b2a;
  background-image:
    repeating-radial-gradient(circle, rgba(255,220,210,.12) 0 1px, rgba(20,0,0,.23) 1.5px 3px, transparent 3.5px 4.6px),
    repeating-conic-gradient(from 18deg, rgba(255,73,35,.13) 0deg 7deg, transparent 7deg 25deg),
    radial-gradient(circle at 34% 25%, #b32a2d 0%, #541018 43%, #100609 82%);
}
/* Giovanni — dourado, âmbar e raios solares */
.v[data-theme="giovanni"], #disc[data-theme="giovanni"] {
  --vinyl-shadow: #1a1005; --vinyl-mid: #64400d; --vinyl-glow: #d99a25;
  background-image:
    repeating-radial-gradient(circle, rgba(255,241,190,.15) 0 1px, rgba(42,23,0,.22) 1.5px 3px, transparent 3.5px 4.6px),
    conic-gradient(from 0deg, transparent 0deg 12deg, rgba(255,214,94,.16) 13deg 18deg, transparent 19deg 45deg),
    radial-gradient(circle at 36% 26%, #d99b32 0%, #69400e 48%, #1a1005 83%);
}
/* Diego — azul profundo, céu noturno e reflexos elétricos */
.v[data-theme="diego"], #disc[data-theme="diego"] {
  --vinyl-shadow: #050b1b; --vinyl-mid: #102b63; --vinyl-glow: #3979ce;
  background-image:
    repeating-radial-gradient(circle, rgba(193,220,255,.16) 0 1px, rgba(0,7,28,.25) 1.5px 3px, transparent 3.5px 4.6px),
    conic-gradient(from 210deg, transparent 0 55deg, rgba(91,170,255,.20) 56deg 76deg, transparent 77deg 190deg, rgba(126,151,255,.12) 191deg 220deg, transparent 221deg),
    radial-gradient(circle at 34% 25%, #3979ce 0%, #142c66 48%, #050b1b 83%);
}
/* Miguel — vinho escuro, vermelho intenso e contraste dramático */
.v[data-theme="miguel"], #disc[data-theme="miguel"] {
  --vinyl-shadow: #0d0509; --vinyl-mid: #4b0916; --vinyl-glow: #a51b2a;
  background-image:
    repeating-radial-gradient(circle, rgba(255,220,220,.13) 0 1px, rgba(15,0,5,.25) 1.5px 3px, transparent 3.5px 4.6px),
    repeating-radial-gradient(circle at 50% 50%, transparent 0 16px, rgba(245,35,53,.14) 17px 18px, transparent 19px 31px),
    radial-gradient(circle at 34% 25%, #a51b2a 0%, #4b0916 49%, #0d0509 84%);
}
/* Lupita — turquesa, lilás e uma mistura mais leve de cores */
.v[data-theme="lupita"], #disc[data-theme="lupita"] {
  --vinyl-shadow: #061615; --vinyl-mid: #14534d; --vinyl-glow: #4cbca8;
  background-image:
    repeating-radial-gradient(circle, rgba(220,255,246,.15) 0 1px, rgba(0,20,20,.23) 1.5px 3px, transparent 3.5px 4.6px),
    conic-gradient(from 15deg, rgba(56,224,184,.12), transparent 25%, rgba(167,123,255,.15) 42%, transparent 62%, rgba(255,211,107,.12) 82%, transparent),
    radial-gradient(circle at 34% 25%, #4cbca8 0%, #174e52 48%, #061615 83%);
}

/* Selos centrais: identidade de cada disco, sem depender só de uma letra */
.v .label, #disc .label {
  border: 1px solid rgba(255,255,255,.36);
  box-shadow: inset 0 1px 5px rgba(255,255,255,.23), inset 0 -5px 9px rgba(0,0,0,.22), 0 2px 8px rgba(0,0,0,.42);
  text-shadow: 0 1px 3px rgba(0,0,0,.55);
}
.label::before {
  content: "";
  position: absolute;
  inset: 7%;
  border: 1px solid rgba(255,255,255,.30);
  border-radius: 50%;
  pointer-events: none;
}
.v[data-theme="mia"] .label, #disc[data-theme="mia"] .label {
  color: #fff5fa;
  background: radial-gradient(circle at 34% 28%, #ffe9f2 0%, #e99abb 45%, #873e70 100%);
}
.v[data-theme="roberta"] .label, #disc[data-theme="roberta"] .label {
  color: #fff;
  background: conic-gradient(#ff563b 0 28%, #33070e 29% 38%, #d20e27 39% 68%, #38070f 69% 78%, #ff563b 79%);
}
.v[data-theme="giovanni"] .label, #disc[data-theme="giovanni"] .label {
  color: #fff7d8;
  background: radial-gradient(circle, #fff1a8 0 12%, #f4b52f 13% 48%, #9b510b 100%);
}
.v[data-theme="diego"] .label, #disc[data-theme="diego"] .label {
  color: #eef6ff;
  background: radial-gradient(circle at 35% 28%, #a6d5ff 0%, #397bd3 43%, #0a1b54 100%);
}
.v[data-theme="miguel"] .label, #disc[data-theme="miguel"] .label {
  color: #fff;
  background: radial-gradient(circle, #fff 0 9%, #e52b3a 10% 54%, #560815 55% 100%);
}
.v[data-theme="lupita"] .label, #disc[data-theme="lupita"] .label {
  color: #163b39;
  text-shadow: 0 1px 1px rgba(255,255,255,.35);
  background: conic-gradient(from 25deg, #55e2c0, #b49bff, #ffe08b, #55e2c0);
}

@media (prefers-reduced-motion: reduce) {
  body::before { animation: none; }
  .v { transition: none; }
}

</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="app">
  <div><h1>Elite Way Records</h1><div id="now">Arraste um disco até o toca-discos</div></div>
  <div id="deck">
    <div id="platter-base">
      <div id="platter">
        <div id="disc"><div class="label" id="dl"></div></div>
      </div>
    </div>
    
    <div id="arm-base">
      <div id="arm"></div>
    </div>
    <button id="stop">⏏ Ejetar Disco</button>
    
    <!-- Adesivos SVG desenhados -->
    <div class="stk" style="left: 5%; bottom: 8%" data-q="cowboy">
      <svg viewBox="0 0 24 24"><path d="M2 17c5 4 15 4 20 0l-3-3c-5-2-9-2-14 0zM6 14c0-7 12-7 12 0" fill="#8b4513" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/></svg>
    </div>
    <div class="stk" style="left: 30%; bottom: 5%" data-q="guitar">
      <svg viewBox="0 0 24 24">
        <path d="M11 2h2v8h-2z M12 10c-1.5 0-3 1-3.5 2.5-.5 1.5-1.5 3-1.5 4.5a5 5 0 0010 0c0-1.5-1-3-1.5-4.5-.5-1.5-2-2.5-3.5-2.5z" fill="#a02020" stroke="#fff" stroke-width="1.5"/>
      </svg>
    </div>
    <div class="stk" style="right: 10%; top: 50%" data-q="tie">
      <svg viewBox="0 0 24 24"><path d="M10 2h4l1 6-3 4 3 10H9l3-10-3-4z" fill="#e0102f" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/></svg>
    </div>
    <div class="stk" style="right: 35%; bottom: 8%" data-q="star">
      <svg viewBox="0 0 24 24"><path d="M12 2l3 6.5 7 1-5 5 1.5 7-6.5-4-6.5 4 1.5-7-5-5 7-1z" fill="#ffd700" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/></svg>
    </div>
    <div class="stk" style="left: 3%; top: 8%" data-q="fire">
      <svg viewBox="0 0 24 24">
        <path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z" fill="#ff4500" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/>
      </svg>
    </div>
  </div>
  <div><div id="shelf"></div><div id="hint"></div></div>
</div>

<script>
const $ = s => document.querySelector(s);
const cv = $('#cv'), cx = cv.getContext('2d');
let W, H; function rs() { W = cv.width = innerWidth; H = cv.height = innerHeight; } rs(); addEventListener('resize', rs);

const C = [
 {id:'mia',name:'Mia',song:'Solo Quédate en Silencio',col:'#ff7eb6',bg:'#2a0f1c',lab:'radial-gradient(#c0c0c0 0 12%,#ffb3d1 13%)',mark:'★',fx:'notes',wave:'sine',bpm:96,scale:[0,4,7,12,7,4],root:64,file:'solo_quedate.mp3'},
 {id:'roberta',name:'Roberta',song:'Fuego',col:'#ff1a2e',bg:'#0b0000',lab:'conic-gradient(#d40018 0 30%,#111 0 38%,#d40018 0 70%,#111 0 78%,#d40018 0)',mark:'R',fx:'shake',wave:'sawtooth',bpm:120,scale:[0,0,3,0,5,3],root:52,file:'fuego.mp3'},
 {id:'giovanni',name:'Giovanni',song:'Un Poco de Tu Amor',col:'#ffd400',bg:'#150a00',lab:'linear-gradient(135deg,#ff7a00,#ffe600)',mark:'G',fx:'waves',wave:'square',bpm:104,scale:[0,4,7,9,12,9,7,4],root:60,file:'um_poco_de_tu_amor.mp3'},
 {id:'diego',name:'Diego',song:'Tras de Mí',col:'#2f6bff',bg:'#020817',lab:'radial-gradient(#9cc0ff 0 10%,#0a2a8a 11%)',mark:'D',fx:'travel',wave:'triangle',bpm:130,scale:[0,3,7,10,7,3],root:55,file:'tras_de_mi.mp3'},
 {id:'miguel',name:'Miguel',song:'Este Corazón',col:'#ff2a2a',bg:'#050000',lab:'radial-gradient(#fff 0 8%,#d00 9% 55%,#111 56%)',mark:'M',fx:'stars',wave:'sawtooth',bpm:92,scale:[0,0,7,0,5,7,3,0],root:50,file:'este_corazon.mp3'},
 {id:'lupita',name:'Lupita',song:'Otro Día Que Va',col:'#38e0b8',bg:'#02110e',lab:'conic-gradient(#38e0b8,#a77bff,#ffd36b,#38e0b8)',mark:'L',fx:'rain',wave:'sine',bpm:80,scale:[0,2,4,7,9,7,4,2],root:62,file:'otro_dia.mp3'}
];

const Q = {
 cowboy:['Não fui ver suas misérias', 'Vou vinga-lo, papai.', 'Malditos Colucci'],
 guitar:['A Roberta está louca!', 'Caipira sem educação!!!', 'Y soy rebelde!!!'],
 tie:['Que difícil é ser eu!', 'Já jantei e não como porcaria.', 'Ai que divino ser eu'],
 star:['No hay nadie que pueda destruir mi fe','Con el nudo en la garganta y es que no te dejo de pensar', 'Sálvame!!!'],
 fire:['As pessoas normais me dão preguiça', 'Eu não sou rebelde sem causa, só tenho causas que ninguém entende', 'Orfã de neurônios!']
};

const shelf = $('#shelf');
C.forEach((c,i) => {
 const v = document.createElement('div'); v.className = 'v'; v.dataset.i = i; v.dataset.theme = c.id;
 v.innerHTML = `<div class="label">${c.mark}</div><span class="n">${c.name}</span>`;
 shelf.appendChild(v);
 let drag = null, moved = false;
 v.addEventListener('pointerdown', e => {
  e.preventDefault(); moved = false; v.setPointerCapture(e.pointerId);
  const r = v.getBoundingClientRect(); drag = {dx: e.clientX - r.left, dy: e.clientY - r.top, w: r.width};
 });
 v.addEventListener('pointermove', e => {
  if(!drag) return; moved = true;
  if(!v.classList.contains('drag')) { v.classList.add('drag'); v.style.width = drag.w + 'px'; $('#platter').classList.add('drop'); }
  v.style.left = (e.clientX - drag.w/2) + 'px'; v.style.top = (e.clientY - drag.w/2) + 'px';
 });
 v.addEventListener('pointerup', e => {
  if(!drag) return;
  const pr = $('#platter').getBoundingClientRect();
  const inside = e.clientX > pr.left && e.clientX < pr.right && e.clientY > pr.top && e.clientY < pr.bottom;
  v.classList.remove('drag'); v.style.cssText = ''; $('#platter').classList.remove('drop');
  if(inside || !moved) play(i);
  drag = null;
 });
});

let ac, timer, step = 0, cur = -1, audioEl = null, pulse = 0;
function note(c, n) {
 const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
 o.type = c.wave; o.frequency.value = 440 * Math.pow(2, (c.root + n - 69) / 12);
 g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.12, t + .02); g.gain.exponentialRampToValueAtTime(.0001, t + .35);
 o.connect(g).connect(ac.destination); o.start(t); o.stop(t + .4);
 if(step % 4 === 0) { const k = ac.createOscillator(), kg = ac.createGain(); k.frequency.setValueAtTime(140, t); k.frequency.exponentialRampToValueAtTime(40, t + .15); kg.gain.setValueAtTime(.3, t); kg.gain.exponentialRampToValueAtTime(.0001, t + .2); k.connect(kg).connect(ac.destination); k.start(t); k.stop(t + .25); }
}
function stopAudio() { clearInterval(timer); if(audioEl) { audioEl.pause(); audioEl = null; } }
function play(i) {
 const c = C[i]; cur = i; stopAudio();
 document.querySelectorAll('.v').forEach(x => x.classList.toggle('used', +x.dataset.i === i));
 const r = document.documentElement.style; r.setProperty('--accent', c.col);
 document.body.dataset.theme = c.id; document.body.style.setProperty('--scene-base', c.bg);
 $('#disc').dataset.theme = c.id; $('#dl').dataset.theme = c.id;
 $('#disc').classList.add('on','spin'); $('#dl').textContent = c.mark;
 $('#arm').classList.remove('down');
 $('#now').textContent = '🎶 ' + c.name + ' — ' + c.song;
 setTimeout(() => {
  if(cur !== i) return; $('#arm').classList.add('down');
  if(c.file) { audioEl = new Audio(c.file); audioEl.loop = true; audioEl.play().catch(() => {}); }
  else { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); ac.resume(); step = 0;
   timer = setInterval(() => { note(c, c.scale[step % c.scale.length]); pulse = 1; step++; }, 60000 / c.bpm / 2); }
 }, 900);
 parts.length = 0;
}
$('#stop').onclick = () => {
 cur = -1; stopAudio(); $('#disc').classList.remove('on','spin'); $('#arm').classList.remove('down'); $('#now').textContent = 'Arraste um disco até o toca-discos';
 document.querySelectorAll('.v').forEach(x => x.classList.remove('used'));
 delete document.body.dataset.theme; document.body.style.removeProperty('--scene-base');
 $('#disc').removeAttribute('data-theme'); $('#dl').removeAttribute('data-theme');
 document.body.style.filter = ''; document.documentElement.style.setProperty('--accent','#e0102f');
};

document.querySelectorAll('.stk').forEach(s => s.addEventListener('click', e => {
 if(cur < 0) { $('#now').textContent = 'Coloque um disco primeiro 😉'; return; }
 const a = Q[s.dataset.q], d = document.createElement('div'); d.className = 'quote'; d.textContent = '“' + a[Math.random() * a.length | 0] + '”';
 const r = s.getBoundingClientRect(); d.style.left = Math.max(10, Math.min(innerWidth * .2, r.left - 60)) + 'px'; d.style.top = (r.top - 20) + 'px';
 document.body.appendChild(d); setTimeout(() => d.remove(), 3600);
}));

const parts = []; let t0 = 0, shake = 0;
function spawn(c) {
 const f = c.fx, col = c.col;
 if(f === 'stars') parts.push({x: Math.random() * W, y: -10, vx: (Math.random() - .5) * .6, vy: 1 + Math.random() * 1.5, s: 6 + Math.random() * 8, l: 1, r: Math.random() * 6, type: 'star', col});
 if(f === 'shake') parts.push({x: W/2 + (Math.random() - .5) * W * .5, y: H * .55, vx: (Math.random() - .5) * 8, vy: -2 - Math.random() * 7, s: 2 + Math.random() * 2, l: 1, type: 'spark', col: Math.random() < .5 ? '#ff3b1f' : '#ffb000'}); // Fogo exclusivo da Roberta
 if(f === 'waves') parts.push({x: Math.random() * W, y: H + 10, vx: (Math.random() - .5) * 2, vy: -1 - Math.random() * 3, s: 12 + Math.random() * 12, l: 1, type: 'heart', col: '#ffd400'}); // Corações exclusivos do Giovanni
 if(f === 'travel') parts.push({x: Math.random() * W, y: Math.random() * H, vx: -18 - Math.random() * 20, vy: 0, s: 2 + Math.random() * 3, l: 1, type: 'streak', col: `hsl(${Math.random() * 360},100%,60%)`});
 if(f === 'rain') parts.push({x: Math.random() * W, y: -20, vx: 0, vy: 8 + Math.random() * 6, s: 12 + Math.random() * 16, l: 1, type: 'drop', col});
 if(f === 'notes') parts.push({x: Math.random() * W, y: H + 10, vx: (Math.random() - .5), vy: -1 - Math.random() * 1.5, s: 16 + Math.random() * 14, l: 1, type: 'note', col: Math.random() < .5 ? col : '#a77bff'});
}

function frame(t) {
 const c = cur >= 0 ? C[cur] : null;
 cx.clearRect(0, 0, W, H);
 pulse *= .92;
 if(c) {
  const bx = W / 2, by = H * .5;
  
  // Apenas as ondas de música (Giovanni e Diego) geram os anéis
  if(c.fx === 'waves' || c.fx === 'travel') {
   for(let k = 0; k < 6; k++) {
    const rad = ((t / 6 + k * 110) % 660) * (1 + pulse * .15); cx.beginPath(); cx.arc(bx, by, rad, 0, 7);
    cx.strokeStyle = c.fx === 'travel' ? `hsla(${(t / 8 + k * 60) % 360},100%,60%,${1 - rad / 660})` : `rgba(255,200,0,${(1 - rad / 660) * .5})`;
    cx.lineWidth = 3 + pulse * 5; cx.stroke();
   }
  } else {
   const g = cx.createRadialGradient(bx, by, 0, bx, by, Math.max(W, H) * .6); 
   g.addColorStop(0, c.col + (pulse > .3 ? '55' : '28')); g.addColorStop(1, 'transparent'); 
   cx.fillStyle = g; cx.fillRect(0, 0, W, H);
  }
  
  if(c.fx === 'travel') { document.body.style.filter = `hue-rotate(${(t / 20) % 40}deg)`; } else document.body.style.filter = '';
  
  const n = (c.fx === 'shake' || c.fx === 'travel') ? 4 : 1 + (t % 3 < 1 ? 1 : 0);
  if(Math.random() < .9) for(let i = 0; i < n; i++) spawn(c);
  shake = c.fx === 'shake' ? pulse * 7 : 0;
 } else document.body.style.filter = '';
 
 $('#app').style.transform = shake ? `translate(${(Math.random() - .5) * shake}px,${(Math.random() - .5) * shake}px)` : '';
 
 for(let i = parts.length - 1; i >= 0; i--) {
  const p = parts[i]; p.x += p.vx; p.y += p.vy; if(p.type === 'spark') { p.vy += .2; p.l -= .02; }
  if(p.x < -60 || p.x > W + 60 || p.y > H + 60 || p.y < -60 || p.l <= 0) { parts.splice(i, 1); continue; }
  cx.globalAlpha = Math.max(p.l, 0); cx.fillStyle = cx.strokeStyle = p.col;
  
  if(p.type === 'star') { cx.font = p.s * 2 + 'px serif'; cx.fillText('★', p.x, p.y); }
  else if(p.type === 'note') { cx.font = p.s + 'px serif'; cx.fillText('♪', p.x, p.y); }
  else if(p.type === 'heart') { cx.font = p.s + 'px sans-serif'; cx.fillText('♥', p.x, p.y); }
  else if(p.type === 'streak') { cx.lineWidth = p.s; cx.beginPath(); cx.moveTo(p.x, p.y); cx.lineTo(p.x - p.vx * 2, p.y); cx.stroke(); }
  else if(p.type === 'drop') { cx.lineWidth = 2; cx.beginPath(); cx.moveTo(p.x, p.y); cx.lineTo(p.x, p.y - p.s); cx.stroke(); }
  else { cx.beginPath(); cx.arc(p.x, p.y, p.s, 0, 7); cx.fill(); }
 }
 cx.globalAlpha = 1; requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
